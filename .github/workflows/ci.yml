name: CI / CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test & Lint Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zendesk_app
          POSTGRES_PASSWORD: zendesk_secure_pass_2026
          POSTGRES_DB: zendesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry-core wheel
          pip install -e ./shared -e ./backend -e ./mcp-server --no-deps
          pip install \
            fastapi uvicorn[standard] pydantic pydantic-settings python-dotenv \
            httpx sqlalchemy[asyncio] alembic asyncpg aiosqlite greenlet \
            pyjwt bcrypt redis celery mcp respx pytest pytest-asyncio pytest-cov

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://zendesk_app:zendesk_secure_pass_2026@localhost:5432/zendesk_test
        run: |
          alembic upgrade head

      - name: Run Full Test Suite with Coverage
        run: |
          pytest --cov=shared --cov=backend --cov=mcp_server --cov-report=term-missing backend/ shared/ mcp-server/

      - name: Validate and Package Zendesk App
        run: |
          python zendesk-app/package_app.py
          test -f dist/zendesk-ticket-summarizer.zip
