[project]
name = "zendesk-summarizer-shared"
version = "0.1.0"
description = "Shared configuration, Zendesk client, and AI summarization library"
authors = [
    { name = "Zendesk Summarizer Team" }
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0"
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
respx = ">=0.21.1"
pytest-asyncio = "^1.4.0"

[tool.poetry]
packages = [{include = "zendesk_summarizer_shared"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
