[project]
name = "zendesk-summarizer-backend"
version = "0.1.0"
description = "FastAPI backend service for Zendesk Ticket Summarizer"
authors = [
    { name = "Zendesk Summarizer Team" }
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "zendesk-summarizer-shared",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0"
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = "^1.4.0"
respx = "^0.23.1"

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.dependencies]
zendesk-summarizer-shared = { path = "../shared", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
