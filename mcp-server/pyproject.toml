[project]
name = "zendesk-summarizer-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Zendesk Ticket Summarizer"
authors = [
    { name = "Zendesk Summarizer Team" }
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "zendesk-summarizer-shared",
    "mcp>=1.0.0",
    "httpx>=0.27.0,<1.0.0"
]

[tool.poetry]
packages = [{include = "mcp_server"}]

[tool.poetry.dependencies]
zendesk-summarizer-shared = { path = "../shared", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]
